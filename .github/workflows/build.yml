name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

env:
  PUBLISH_DIR: publish/EDay-Extractor

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build EDayExtractor.sln -c Release -nologo

      # Self-contained, so users don't need the .NET Desktop Runtime installed.
      - name: Publish
        run: dotnet publish src/Index.App/Index.App.csproj -c Release -r win-x64 --self-contained true -o ${{ env.PUBLISH_DIR }} -nologo

      - name: Check output
        shell: pwsh
        run: |
          foreach ( $file in 'EDayExtractor.exe', 'Index.Profiles.GearsEDay.dll', 'CUE4Parse.dll' ) {
            if ( -not ( Test-Path "$env:PUBLISH_DIR/$file" ) ) { throw "$file was not published." }
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: EDay-Extractor-win-x64
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  release:
    # Pushing a tag like v1.0.0 publishes the build as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: EDay-Extractor-win-x64
          path: EDay-Extractor

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -qr "EDay-Extractor-$TAG-win-x64.zip" EDay-Extractor
          gh release create "$TAG" "EDay-Extractor-$TAG-win-x64.zip" \
            --repo "$GITHUB_REPOSITORY" --title "E-Day Extractor $TAG" --generate-notes
